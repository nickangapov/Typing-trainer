<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тренажер по грамматике</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="container__content">
            <div class="question__pagination pagination">
                <button class="pagination__button pagination__button--active">1</button>
                <button class="pagination__button">2</button>
                <button class="pagination__button">3</button>
                <button class="pagination__button">4</button>
                <button class="pagination__button">5</button>
                <button class="pagination__button">6</button>
            </div>
            <img class="container__img">
            <div class="container__field">
                <span class="container__text"></span>
                <form class="container__form">
                    <input class="container__input" type="text" name="input" id="input" >
                    <button type="submit" class="container__button" disabled>
                        <svg width="73" height="68" viewBox="0 0 73 68" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M30.387 65.515L1.69298 26.2998C1.39782 25.8964 1.44584 25.337 1.80541 24.9898L14.8532 12.392C15.2893 11.9709 15.9968 12.0317 16.3548 12.5209L29.885 31.0122C30.2803 31.5525 31.0845 31.5593 31.4889 31.0258L53.5712 1.89603C53.9058 1.4546 54.5355 1.36929 54.9756 1.70577L70.3849 13.4894C70.8231 13.8245 70.9072 14.451 70.5729 14.8898L31.9895 65.5305C31.5844 66.0622 30.7817 66.0544 30.387 65.515Z" fill="currentColor" stroke="black" stroke-width="3"/>
                        </svg>
                    </button>
                </form> 
            </div>
        </div>
        <button class="reset__btn">
            <svg width="71" height="72" viewBox="0 0 71 72" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18.9595 36.7533L1.77463 54.8671C1.40157 55.2603 1.40971 55.8792 1.79299 56.2625L14.8788 69.3483C15.2764 69.7459 15.9236 69.7376 16.3109 69.3299L33.9063 50.8084C34.2902 50.4043 34.9306 50.3921 35.3296 50.7814L54.3972 69.384C54.7891 69.7663 55.4156 69.7624 55.8027 69.3753L68.8971 56.2808C69.2877 55.8903 69.2877 55.2571 68.8971 54.8666L50.8025 36.7719C50.4154 36.3849 50.4115 35.7586 50.7936 35.3667L68.9265 16.7688C69.304 16.3817 69.3053 15.7645 68.9295 15.3757L55.8111 1.80501C55.4227 1.40316 54.7803 1.39771 54.3851 1.79292L35.3114 20.8666C34.9208 21.2571 34.2877 21.2571 33.8971 20.8666L16.2866 3.25603C15.9058 2.87533 15.2921 2.86438 14.898 3.23125L1.83377 15.3945C1.43049 15.77 1.40693 16.401 1.78109 16.8055L18.9681 35.386C19.326 35.7729 19.3222 36.371 18.9595 36.7533Z" fill="#C30000" stroke="black" stroke-width="3"/>
            </svg>
        </button>
    </main>
    <script src="script.js"></script>
</body>
</html>
