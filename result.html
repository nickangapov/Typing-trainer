<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Итог</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="table__content">
    <div class="table__wrap">
      <div class="question__pagination pagination">
        <button class="pagination__button">1</button>
        <button class="pagination__button">2</button>
        <button class="pagination__button">3</button>
        <button class="pagination__button">4</button>
        <button class="pagination__button">5</button>
        <button class="pagination__button">6</button>
      </div>
      <table class="table__body">
        <thead>
          <tr>
            <th class="table__cell table__cell--num">#</th>
            <th class="table__cell table__cell--img">
              <span class="word">К<span class="red">А</span>РТ<span class="red">И</span>НК<span class="red">А</span></span>
            </th>
            <th class="table__cell table__cell--text">
              <span class="word">ПР<span class="red">А</span>В<span class="red">И</span>ЛЬН<span class="red">Ы</span>Й <span class="red">О</span>ТВ<span class="red">Е</span>Т</span>
            </th>
            <th class="table__cell table__cell--text">
              <span class="word">ТВ<span class="red">О</span>Й <span class="red">О</span>ТВ<span class="red">Е</span>Т</span>
            </th>
            <th class="table__cell table__cell--result">
              <span class="word">Р<span class="red">Е</span>З<span class="red">У</span>ЛЬТ<span class="red">А</span>Т</span>
            </th>
          </tr>
        </thead>

        <tbody>
          <!-- 1. Тюмень
          2. Зелень
          3. Ашан
          4. Каток
          5. Каток -->
          <tr>
            <td class="table__cell table__cell--num">3</td>
            <td class="table__cell table__cell--img">
              <img class="img" src="img/1.png" alt="Тюмень">
            </td>
            <td class="table__cell">
              <span class="word">Т<span class="red">Ю</span>М<span class="red">Е</span>НЬ</span>
            </td>
            <td class="table__cell table__cell--answer"></td>
            <td class="table__cell table__cell--result">
              <img class="icon" src="img/ok.png" alt="Верно">
            </td>
          </tr>

          <tr>
            <td class="table__cell table__cell--num">1</td>
            <td class="table__cell table__cell--img">
              <img class="img" src="img/2.png" alt="Зелень">
            </td>
            <td class="table__cell">
              <span class="word">З<span class="red">Е</span>Л<span class="red">Е</span>НЬ</span>
            </td>
            <td class="table__cell table__cell--answer"></td>
            <td class="table__cell table__cell--result">
              <img class="icon" src="img/ok.png" alt="Верно">
            </td>
          </tr>

          <tr>
            <td class="table__cell table__cell--num">2</td>
            <td class="table__cell table__cell--img">
              <img class="img" src="img/3.png" alt="Ашан">
            </td>
            <td class="table__cell">
              <span class="word"><span class="red">А</span>ШАН</span>
            </td>
            <td class="table__cell table__cell--answer"></td>
            <td class="table__cell table__cell--result">
              <img class="icon" src="img/error.png" alt="Неверно">
            </td>
          </tr>



          <tr>
            <td class="table__cell table__cell--num">4</td>
            <td class="table__cell table__cell--img">
              <img class="img" src="img/4.png" alt="Каток">
            </td>
            <td class="table__cell">
              <span class="word">К<span class="red">А</span>Т<span class="red">О</span>К</span>
            </td>
            <td class="table__cell table__cell--answer"></td>
            <td class="table__cell table__cell--result">
              <img class="icon" src="img/ok.png" alt="Верно">
            </td>
          </tr>

          <tr>
            <td class="table__cell table__cell--num">5</td>
            <td class="table__cell table__cell--img">
              <img class="img" src="img/5.png" alt="Каток">
            </td>
            <td class="table__cell">
              <span class="word">К<span class="red">А</span>Т<span class="red">О</span>К</span>
            </td>
            <td class="table__cell table__cell--answer">
              <!-- <span class="word">К<span class="red">А</span>Т<span class="red">О</span>К</span> -->
            </td>
            <td class="table__cell table__cell--result">
              <img class="icon" src="img/ok.png" alt="Верно">
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <button class="reset__btn" type="button" aria-label="Закрыть">
      <svg class="close__icon" width="71" height="72" viewBox="0 0 71 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18.9595 36.7533L1.77463 54.8671C1.40157 55.2603 1.40971 55.8792 1.79299 56.2625L14.8788 69.3483C15.2764 69.7459 15.9236 69.7376 16.3109 69.3299L33.9063 50.8084C34.2902 50.4043 34.9306 50.3921 35.3296 50.7814L54.3972 69.384C54.7891 69.7663 55.4156 69.7624 55.8027 69.3753L68.8971 56.2808C69.2877 55.8903 69.2877 55.2571 68.8971 54.8666L50.8025 36.7719C50.4154 36.3849 50.4115 35.7586 50.7936 35.3667L68.9265 16.7688C69.304 16.3817 69.3053 15.7645 68.9295 15.3757L55.8111 1.80501C55.4227 1.40316 54.7803 1.39771 54.3851 1.79292L35.3114 20.8666C34.9208 21.2571 34.2877 21.2571 33.8971 20.8666L16.2866 3.25603C15.9058 2.87533 15.2921 2.86438 14.898 3.23125L1.83377 15.3945C1.43049 15.77 1.40693 16.401 1.78109 16.8055L18.9681 35.386C19.326 35.7729 19.3222 36.371 18.9595 36.7533Z" fill="#C30000" stroke="black" stroke-width="3"/>
      </svg>
    </button>
    <script src="script.js"></script>
  </main>
</body>
</html>
